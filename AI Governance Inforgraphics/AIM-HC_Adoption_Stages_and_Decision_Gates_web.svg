    <text x="400.0" y="491.52" font-size="21" fill="#1A5632" font-weight="700" text-anchor="middle" textLength="46.7" lengthAdjust="spacingAndGlyphs">Gate</text>
  </g>
  <g id="decision-gate-3">
    <polygon points="400.0,718.25 558.75,769.0 400.0,819.75 241.25,769.0" fill="#FFFFFF" stroke="#1A5632" stroke-width="2.5" stroke-linejoin="miter"/>
    <text x="400.0" y="763.52" font-size="21" fill="#1A5632" font-weight="700" text-anchor="middle" textLength="87.5" lengthAdjust="spacingAndGlyphs">Decision</text>
    <text x="400.0" y="789.52" font-size="21" fill="#1A5632" font-weight="700" text-anchor="middle" textLength="46.7" lengthAdjust="spacingAndGlyphs">Gate</text>
  </g>
  <g id="review-continued-use">
    <polygon points="400.0,1016.25 558.75,1067.0 400.0,1117.75 241.25,1067.0" fill="#F1F8F8" stroke="#007580" stroke-width="2.5" stroke-linejoin="miter"/>
    <text x="400.0" y="1061.52" font-size="21" fill="#007580" font-weight="700" text-anchor="middle" textLength="72.4" lengthAdjust="spacingAndGlyphs">Review</text>
    <text x="400.0" y="1087.52" font-size="21" fill="#007580" font-weight="700" text-anchor="middle" textLength="142.3" lengthAdjust="spacingAndGlyphs">continued use</text>
  </g>
  <g id="continued-use-loop">
    <path d="M 558.0 1067.0 H 774 V 943.0 H 746" fill="none" stroke="#007580" stroke-width="2.5" stroke-linejoin="miter"/>
    <polygon points="747,937.0 747,949.0 736,943.0" fill="#007580"/>
    <text x="659.0" y="1030.0" font-size="19" fill="#007580" text-anchor="middle" textLength="129.9" lengthAdjust="spacingAndGlyphs">Continue within</text>
    <text x="659.0" y="1054.0" font-size="19" fill="#007580" text-anchor="middle" textLength="178.5" lengthAdjust="spacingAndGlyphs">approved boundaries</text>
  </g>
  <g id="legend">
    <polygon points="77.0,1163.63 90,1172.13 77.0,1180.63 64,1172.13" fill="#B2F8FF"/>
    <polygon points="77.0,1203.63 90,1212.13 77.0,1220.63 64,1212.13" fill="#B2F8FF"/>
    <text x="104" y="1177.32" font-size="20" fill="#153129" textLength="431.4" lengthAdjust="spacingAndGlyphs">Each Adoption Stage has required assessments.</text>
    <text x="104" y="1217.32" font-size="20" fill="#153129" textLength="498.1" lengthAdjust="spacingAndGlyphs">Earlier Adoption Stage may be omitted with documented</text>
    <text x="104" y="1244.32" font-size="20" fill="#153129" textLength="454.3" lengthAdjust="spacingAndGlyphs">authorization from the applicable decision authority.</text>
  </g>
</svg>
