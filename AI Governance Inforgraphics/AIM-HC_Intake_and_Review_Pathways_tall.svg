<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1085" width="800" height="1085" role="img" aria-labelledby="pathTitle pathDesc" font-family="Arial, Helvetica, sans-serif">
  <title id="pathTitle">One intake. Three review pathways.</title>
  <desc id="pathDesc">Diagram titled One intake. Three review pathways. The AI Governance Program assigns the review pathway. A single road shows three steps: submit the AI intake form; the AI Governance Program triages the request; a review pathway is assigned. The road then splits into three review pathways. Expedited Review: Available Tool within approved uses or research-only work. Focused Review: any request at Development; administrative/operational requests at Pilot or Production. Full Review: clinical requests at Pilot or Production.</desc>
